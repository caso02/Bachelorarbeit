model:
  # --- Backend-Wahl: Modellname bestimmt automatisch den Backend ---
  # SBERT:  "sentence-transformers/all-MiniLM-L6-v2"  (kein API-Key nötig)
  # Gemini: "gemini-embedding-2-preview"               (GOOGLE_API_KEY erforderlich)
  name: "gemini-embedding-2-preview"
  batch_size: 32  # nur für SBERT; bei Gemini ignoriert

  # Gemini-spezifische Optionen (werden ignoriert wenn ein SBERT-Modell gewählt ist)
  gemini:
    api_key: null              # null = liest GOOGLE_API_KEY aus Umgebungsvariable
    output_dimensionality: null  # null = volle 3072 Dims; z.B. 768 für Komprimierung
    task_type: "CLUSTERING"    # CLUSTERING | SEMANTIC_SIMILARITY | RETRIEVAL_DOCUMENT

# --- Modellvergleich (--compare) ---
models:
  - name: "sentence-transformers/all-MiniLM-L6-v2"
  - name: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  - name: "sentence-transformers/all-mpnet-base-v2"

data:
  input_path: "data/raw/sample_posts_300.csv"
  text_column: "text"
  id_column: "id"
  category_column: "category"
  language_filter: null

preprocessing:
  remove_urls: true
  remove_mentions: true
  lowercase: false
  min_text_length: 5

similarity:
  query_index: 0
  top_k: 5

# --- Flat-mode clustering (--mode flat) ---
clustering:
  methods:
    - name: "kmeans"
      params:
        n_clusters: 8
        random_state: 42

    - name: "dbscan"
      params:
        metric: "cosine"
      grid_search:
        eps_values: [0.3, 0.4, 0.5, 0.6, 0.7, 0.8]
        min_samples_values: [2, 3, 4, 5]

    - name: "hdbscan"
      params:
        min_cluster_size: 5
        min_samples: 3

# --- Hierarchical-mode (--mode hierarchical, default) ---
